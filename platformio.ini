; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; Use USB serial for initial flash, then OTA for subsequent updates
; Comment out the next 3 lines for USB upload, uncomment for OTA
; extra_scripts = platformio_upload.py
; upload_protocol = custom
; custom_upload_url = http://ugreen-usb-hub.local/update
lib_compat_mode = strict
lib_deps =
	ayushsharma82/ElegantOTA@^3.1.4
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.0
	https://github.com/tzapu/WiFiManager.git
board_build.filesystem = littlefs
